shellEmulator: true
allowBuilds:
  '@parcel/watcher': true
  # Transitive dep of @nuxt/content, never used: content.experimental.sqliteConnector
  # is 'native' (node:sqlite), so building this compiles an addon nothing loads.
  # Not a workaround for breakage. Checked on 2026-07-28 with better-sqlite3
  # 12.11.1: allowed to build it produces a binary that loads cleanly under Node
  # 26, so the "Module did not self-register" ABI failure that first motivated the
  # native connector no longer reproduces. This stays denied because the output is
  # dead weight and because install scripts are arbitrary code execution; the
  # published tarball ships no prebuilt binary, so a cold install really does
  # fetch or compile one.
  better-sqlite3: false
  esbuild: true
  # lefthook's postinstall only runs `lefthook install -f`, and the binary ships
  # in an optionalDependency rather than being built by this script, so denying
  # it costs nothing. The repo's own `prepare` script calls `lefthook install`
  # instead, where it is visible in package.json rather than implied by a dep.
  lefthook: false
  sharp: true
  vue-demi: true
  # Same shape as esbuild's: the postinstall picks the platform binary out of an
  # optionalDependency (@cloudflare/workerd-linux-64 here) and points bin/workerd at
  # it. Allowed because wrangler is the deploy tool now, and a wrangler whose local
  # runtime is half-installed fails in a much more confusing way than it saves.
  workerd: true
# pnpm 11 will not install a release younger than its default minimum age. wrangler and
# its miniflare dep were inside that window when they were added, so pnpm recorded the
# exemptions here. They pin exact versions, so a wrangler bump adds new lines and leaves
# these behind as dead weight; deleting stale ones is safe.
minimumReleaseAgeExclude:
  - miniflare@4.20260722.1
  - wrangler@4.115.0
